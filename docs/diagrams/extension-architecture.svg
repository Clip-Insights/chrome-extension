<text x="48" y="54" font-size="32" font-weight="700" fill="#232738">Clip Insights / Chrome extension</text><text x="48" y="88" font-size="18" font-weight="400" fill="#586174">Manifest V3 · React 18 · TypeScript · Vite + CRXJS</text>
<text x="48" y="132" font-size="14" font-weight="650" fill="#586174">VIDEO PAGE AND UI</text><rect x="48" y="156" width="304" height="128" rx="12" fill="#f6f7fb" stroke="#d6dae5"/><text x="72" y="190" font-size="22" font-weight="650" fill="#232738">Platform adapter</text><text x="72" y="218" font-size="17" font-weight="400" fill="#586174">YouTube video and transcript</text><text x="72" y="243" font-size="17" font-weight="400" fill="#586174">Page identity and navigation</text><rect x="448" y="156" width="304" height="128" rx="12" fill="#f6f7fb" stroke="#d6dae5"/><text x="472" y="190" font-size="22" font-weight="650" fill="#232738">Content lifecycle</text><text x="472" y="218" font-size="17" font-weight="400" fill="#586174">Mount and unmount the panel</text><text x="472" y="243" font-size="17" font-weight="400" fill="#586174">React inside a Shadow DOM</text><rect x="848" y="156" width="304" height="128" rx="12" fill="#f6f7fb" stroke="#d6dae5"/><text x="872" y="190" font-size="22" font-weight="650" fill="#232738">Feature views</text><text x="872" y="218" font-size="17" font-weight="400" fill="#586174">Timeline, insights, chat</text><text x="872" y="243" font-size="17" font-weight="400" fill="#586174">Auth, export, settings</text><path d="M 352 220 L 448 220" fill="none" stroke="#4255ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 752 220 L 848 220" fill="none" stroke="#4255ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1000 284 L 1000 360" fill="none" stroke="#4255ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="48" y="360" width="1104" height="110" rx="12" fill="#eef0ff" stroke="#4255ff"/><rect x="48" y="376" width="4" height="78" rx="2" fill="#4255ff"/><text x="72" y="394" font-size="22" font-weight="650" fill="#232738">Core services</text><text x="72" y="422" font-size="17" font-weight="400" fill="#586174">API and SSE client · Authentication · Plan values · Transcript cache and slicing</text><text x="72" y="447" font-size="17" font-weight="400" fill="#586174">Storage repository · Screenshot capture · PDF generation · Markdown rendering</text><path d="M 216 470 L 216 548" fill="none" stroke="#4255ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 470 L 600 548" fill="none" stroke="#4255ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 984 470 L 984 548" fill="none" stroke="#4255ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="48" y="548" width="336" height="128" rx="12" fill="#f6f7fb" stroke="#d6dae5"/><text x="72" y="582" font-size="22" font-weight="650" fill="#232738">Browser storage</text><text x="72" y="610" font-size="17" font-weight="400" fill="#586174">IndexedDB: working study data</text><text x="72" y="635" font-size="17" font-weight="400" fill="#586174">Five-day retention on mount</text><rect x="432" y="548" width="336" height="128" rx="12" fill="#f6f7fb" stroke="#d6dae5"/><text x="456" y="582" font-size="22" font-weight="650" fill="#232738">Backend API</text><text x="456" y="610" font-size="17" font-weight="400" fill="#586174">AI, account, usage, PDF upload</text><text x="456" y="635" font-size="17" font-weight="400" fill="#586174">HTTPS and streamed chat</text><rect x="816" y="548" width="336" height="128" rx="12" fill="#f6f7fb" stroke="#d6dae5"/><text x="840" y="582" font-size="22" font-weight="650" fill="#232738">PDF document</text><text x="840" y="610" font-size="17" font-weight="400" fill="#586174">Generated in the browser</text><text x="840" y="635" font-size="17" font-weight="400" fill="#586174">Download or account upload</text><text x="48" y="722" font-size="16" font-weight="400" fill="#586174">YouTube-specific behavior stays behind PlatformAdapter; feature hooks use shared core services.</text>
</g></svg>